<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e8c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Sugar Khata</title>
<style>
:root{--bg:#f4f6f9;--sf:#fff;--tx:#17202a;--mu:#5f6b7a;--pr:#1f4e8c;--pt:#fff;--bd:#dde3ea;--rd:#c0392b;--gn:#1e7a46;--hv:#eef3f9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--sf:#18222d;--tx:#e8edf2;--mu:#93a1b0;--pr:#5b9bd8;--pt:#08121c;--bd:#2a3744;--rd:#ef7467;--gn:#4cb97e;--hv:#1f2c3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--sf:#18222d;--tx:#e8edf2;--mu:#93a1b0;--pr:#5b9bd8;--pt:#08121c;--bd:#2a3744;--rd:#ef7467;--gn:#4cb97e;--hv:#1f2c3a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
.shell{display:flex;min-height:100vh}.main{flex:1;min-width:0}
.side{display:none;width:230px;background:var(--sf);border-right:1px solid var(--bd);padding:18px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{font-weight:700;padding:4px 10px 16px;font-size:14px;line-height:1.3}.brand small{display:block;color:var(--mu);font-weight:400;margin-top:2px}
.sn{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:10px;border-radius:8px;font-size:15px;cursor:pointer}.sn:hover{background:var(--hv)}.sn.on{background:var(--hv);color:var(--pr);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top b{font-size:17px}#pg{max-width:760px;margin:0 auto;padding:16px 14px 96px}
.bot{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nv{flex:1;border:0;background:none;color:var(--mu);padding:9px 2px;font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:center;cursor:pointer}.nv span{font-size:18px}.nv.on{color:var(--pr);font-weight:600}
@media(min-width:900px){.side{display:block}.bot{display:none}#pg{padding-bottom:40px}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}.card h3{margin:0 0 10px;font-size:15px}
label.lb{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--pr);outline-offset:-1px}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}.btn:disabled{opacity:.6}
.btn.o{background:none;color:var(--pr);border:1px solid var(--pr)}.btn.d{background:none;color:var(--rd);border:1px solid var(--rd)}.btn.w{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.mu{color:var(--mu);font-size:13px}.big{font-size:22px;font-weight:700}
.neg{color:var(--rd);font-weight:600}.pos{color:var(--gn);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.grid .card{margin:0}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.seg button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;white-space:nowrap;cursor:pointer}.seg button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer}.li:last-child{border:0}
.st2{padding:9px 0;border-bottom:1px solid var(--bd)}.st2:last-of-type{border:0}.st2 select,.st2 input{width:auto;max-width:60%}
.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.lg .card{width:100%;max-width:360px}
.x{border:0;background:none;color:var(--rd);font-size:16px;cursor:pointer}.ok{color:var(--gn)}
.cp{border:2px solid #25235f;color:#1b1a55;padding:8px;font-size:13px;margin:10px 0;overflow-x:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:Arial,sans-serif}
.k0{background:#fff}.k1{background:#dbe8ff}.k2{background:#fff3b0}
.cp h2{margin:4px 0;text-align:center;font-size:22px}.cp .c{text-align:center;font-weight:700;margin-bottom:6px}
.cp .r1{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:center}.cp .cl{font-size:10px}.cp .gn{background:#25235f;color:#fff;padding:1px 6px;font-size:12px}
.cp table{border-collapse:collapse;width:100%}.cp td,.cp th{border:1px solid #25235f;padding:4px;font-size:12px;text-align:center}.cp td.l{text-align:left}.cp td.r{text-align:right}
.cp .t2{margin:4px 0}.cp .sn{font-size:18px}.cp .ln{border:1px solid #25235f;border-top:0;padding:5px;font-size:12px}
.cp .gb{display:inline-table;width:auto;vertical-align:middle}.cp .gb td{width:16px;height:18px;padding:0}
.cp .it td{height:20px}.cp .it tr.fill td{height:140px}
.cp .fx{display:flex;border:1px solid #25235f;border-top:0}.cp .fx table{width:50%}.cp .lf{flex:1.2;padding:5px;font-size:12px;border-right:1px solid #25235f}.cp .rg{flex:1;padding:5px;text-align:center;font-size:11px}
.cp .rg img{max-height:42px;display:block;margin:2px auto}
body[data-v="0"] .k1,body[data-v="0"] .k2,body[data-v="1"] .k0,body[data-v="1"] .k2,body[data-v="2"] .k0,body[data-v="2"] .k1{display:none}
@media print{.side,.top,.bot,.noprint{display:none!important}#pg{padding:0;max-width:none}body{background:#fff}.shell{display:block}.cp{margin:0;page-break-after:always}}
</style></head><body>

/* ---------- calculations ---------- */
function led(p){const rows=[];if(p.ob>0)rows.push({l:t('oldbal'),d:p.od||'',t:p.ob});
S.b.filter(b=>b.pid==p.id&&b.m=='credit').forEach(b=>rows.push({l:t('billn')+b.no,d:b.d,t:b.tot}));
let P=S.r.filter(r=>r.pid==p.id).reduce((a,r)=>a+r.a,0);
rows.forEach(x=>{x.pd=Math.min(P,x.t);P-=x.pd;x.rem=x.t-x.pd});
return{rows,pend:rows.reduce((a,x)=>a+x.rem,0)-P}}
function cx(it,tx){const sub=it.reduce((a,x)=>a+amt(x),0),h=(FIRM.gstr||5)/200,rd=n=>Math.round(n*100)/100,cg=tx=='in'?rd(sub*h):0,ig=tx=='out'?rd(sub*h*2):0;return{sub,cg,sg:cg,ig,tot:rd(sub+cg*2+ig)}}

async function saveBill(){if(busy)return;const pn=nb.pn.trim(),it=nb.it.filter(x=>amt(x)>0);
if(!pn){alert(t('fillP'));return}if(!it.length){alert(t('fillW'));return}

if(!p){const{data,error}=await sb.from('parties').insert({name:pn,addr:nb.pa,gstin:nb.pg}).select().single();if(error)throw error;pid=data.id}
else{pid=p.id;if((p.addr||'')!=nb.pa||(p.gst||'')!=nb.pg){const{error}=await sb.from('parties').update({addr:nb.pa,gstin:nb.pg}).eq('id',pid);if(error)throw error}}

catch(e){alert(t('err')+': '+(e.message||e))}
